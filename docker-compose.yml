version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: terraform-builder-db
    environment:
      POSTGRES_DB: terraform_builder
      POSTGRES_USER: builder_user
      POSTGRES_PASSWORD: builder_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builder_user -d terraform_builder"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
