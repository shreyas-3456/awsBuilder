# P6Spy Configuration for SQL Query Interception and Logging
# This configuration enables P6Spy to intercept all JDBC operations and log them
# with trace context (traceId, spanId) for correlation with application logs.

# Module list - enables logging and tracing modules
# P6LogFactory: Handles SQL logging
# P6SpyFactory: Core P6Spy functionality
modulelist=com.p6spy.engine.logging.P6LogFactory,com.p6spy.engine.spy.P6SpyFactory

# Custom appender class for trace-aware SQL logging
# Uses the repository's SLF4J-backed P6Spy logger implementation
appender=com.awsBuilder.builder.tracing.logger.TracingP6SpyLogger

# Enable SQL statement filtering and logging
filter=true

# Log execution time for performance monitoring
timing=true

# Include parameter values in logs (formatted and masked for sensitive data)
usePrefix=true

# File output is handled by Logback's com.p6spy logger configuration.

# Reload properties periodically to pick up configuration changes
reloadproperties=true
reloadpropertiesinterval=60

# Exclude health check queries to reduce log noise (optional)
# Uncomment to exclude specific patterns
# exclude=SELECT 1
