spring.application.name=builder
spring.output.ansi.enabled=always
spring.main.banner-mode=console
spring.main.log-startup-info=true
logging.level.root=INFO
logging.level.com.awsBuilder=DEBUG

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:p6spy:postgresql://localhost:5432/terraform_builder}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:builder_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:builder_pass}
spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver
spring.sql.init.mode=always

# Server Configuration
server.port=8080

# AWS Inventory Configuration
aws.inventory.enabled=${AWS_INVENTORY_ENABLED:true}
aws.inventory.region=${AWS_REGION:us-east-1}
aws.inventory.sync-on-startup=${AWS_INVENTORY_SYNC_ON_STARTUP:false}

# Logging
logging.level.root=INFO
logging.level.com.awsBuilder.builder=DEBUG
logging.level.org.springframework.boot=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Tracing Configuration
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,metrics,prometheus

# Logging File Configuration
logging.file.path=logs
logging.file.name=application.log
logging.file.max-history=30
logging.file.total-size-cap=10GB

# SQL Query Logging Configuration
sql.logging.enabled=true
sql.logging.slow-query-threshold=1000

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=5m
